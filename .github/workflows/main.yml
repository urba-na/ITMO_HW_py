name: Build Windows ServiceDesk

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: diplom

    env:
      SECRET_KEY: nNAPkY135_+}&1ndp8I[D)J0<goYeS4
      DATABASE_URL: sqlite:///service_desk.db
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: 12345
      DEFAULT_USER_PASSWORD: 000000
      MAIL_SERVER: sandbox.smtp.mailtrap.io
      MAIL_PORT: 587
      MAIL_USE_TLS: true
      MAIL_USE_SSL: false
      MAIL_USERNAME: 0da57137ac6f0c
      MAIL_PASSWORD: f7a7bfb8db16ac
      MAIL_DEFAULT_SENDER: service-desk@mycompany.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pywebview flask python-dotenv flask-login flask-mail flask-sqlalchemy sqlalchemy jinja2 werkzeug itsdangerous click blinker

      - name: Create .env
        shell: powershell
        run: |
          @"
          SECRET_KEY=$env:SECRET_KEY
          DATABASE_URL=$env:DATABASE_URL
          DEFAULT_ADMIN_USERNAME=$env:DEFAULT_ADMIN_USERNAME
          DEFAULT_ADMIN_PASSWORD=$env:DEFAULT_ADMIN_PASSWORD
          DEFAULT_USER_PASSWORD=$env:DEFAULT_USER_PASSWORD
          MAIL_SERVER=$env:MAIL_SERVER
          MAIL_PORT=$env:MAIL_PORT
          MAIL_USE_TLS=$env:MAIL_USE_TLS
          MAIL_USE_SSL=$env:MAIL_USE_SSL
          MAIL_USERNAME=$env:MAIL_USERNAME
          MAIL_PASSWORD=$env:MAIL_PASSWORD
          MAIL_DEFAULT_SENDER=$env:MAIL_DEFAULT_SENDER
          "@ | Set-Content -Path .env

      - name: Build exe from main.py
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --windowed --onedir --name ServiceDesk `
            --hidden-import flask `
            --hidden-import dotenv `
            --hidden-import flask_login `
            --hidden-import flask_mail `
            --hidden-import flask_sqlalchemy `
            --hidden-import sqlalchemy `
            --hidden-import jinja2 `
            --hidden-import werkzeug `
            --hidden-import itsdangerous `
            --hidden-import click `
            --hidden-import blinker `
            --hidden-import sqlite3 `
            --add-data "templates;templates" `
            --add-data "static;static" `
            main.py

      - name: Prepare release folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release\ServiceDesk | Out-Null
          Copy-Item dist\ServiceDesk\ServiceDesk.exe release\ServiceDesk\
          Copy-Item dist\ServiceDesk\_internal release\ServiceDesk\_internal -Recurse
          Copy-Item .env release\ServiceDesk\.env

      - name: Add run instruction
        shell: powershell
        run: |
          @"
          Для запуска:
          1. Распакуйте архив полностью в отдельную папку.
          2. Не удаляйте папку _internal и файл .env.
          3. Запустите ServiceDesk.exe двойным щелчком.
          "@ | Set-Content -Path release\ServiceDesk\README.txt

      - name: Create zip
        shell: powershell
        run: |
          Compress-Archive -Path release\ServiceDesk -DestinationPath release\ServiceDesk-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServiceDesk-Windows
          path: diplom/release/ServiceDesk-Windows.zip
