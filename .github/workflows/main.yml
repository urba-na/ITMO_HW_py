name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: diplom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build app
        run: python -m PyInstaller --noconfirm --windowed --onedir --name ServiceDesk --add-data "templates;templates" --add-data "static;static" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServiceDesk-Windows
          path: diplom/dist/ServiceDesk
